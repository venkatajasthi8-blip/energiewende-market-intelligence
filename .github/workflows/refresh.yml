name: refresh data

# Every morning: download yesterday's database from the release, add the new
# SMARD data, then upload it again. The dashboard reads it from there.
on:
  schedule:
    - cron: "17 6 * * *"     # 06:17 UTC every day
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Get the current database
        run: |
          if gh release download data --pattern energy.db.gz --dir data; then
            python -c "from emi.db import import_gz; import_gz('data/energy.db.gz', 'data/energy.db')"
            rm data/energy.db.gz
          else
            echo "No database yet, the first run downloads everything"
          fi

      - name: Run the pipeline
        run: python -m emi.pipeline --export data/energy.db.gz

      - name: Upload the new database
        run: |
          gh release view data || gh release create data --title "Data" --notes "Updated every day. Data: Bundesnetzagentur | SMARD.de (CC BY 4.0)"
          gh release upload data data/energy.db.gz --clobber